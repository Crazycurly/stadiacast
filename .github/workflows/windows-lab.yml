name: Windows lab

# The Windows-only paths on a Windows runner, by hand: the whole test suite on Windows, the ViGEm
# pad against the real ViGEmBus driver (read back through XInput, rumble through ViGEm's
# notification), the WASAPI loopback capture against a virtual audio device, and the Windows
# executables. Nothing is released.
#
# GitHub's hosted runners are Windows Server, which ships without the Xbox 360 controller driver a
# ViGEm pad binds to and without any audio endpoint, so those two tests skip there and the run
# verifies the rest. Point `runner` at a self-hosted Windows 10/11 runner for the full set.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "runs-on label: windows-latest (hosted, Windows Server, cannot host a ViGEm pad) or a self-hosted Windows 10/11 runner"
        default: windows-latest
        required: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: ${{ inputs.runner || 'windows-latest' }}
    timeout-minutes: 40
    env:
      # vgamepad's build script opens the ViGEmBus installer window when the driver is absent;
      # the driver is installed below, with the quiet switches
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras --group release --locked

      - name: the whole test suite on Windows
        run: uv run pytest -q

      - name: install the ViGEmBus driver
        shell: pwsh
        run: |
          $url = "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\ViGEmBus.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\ViGEmBus.exe" -ArgumentList "/exenoui","/qn","/norestart" -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -notin 0, 3010) { exit $p.ExitCode }
          Get-PnpDevice | Where-Object { $_.FriendlyName -like "*ViGEm*" -or $_.FriendlyName -like "*Virtual Gamepad*" } | Format-Table Status, FriendlyName -AutoSize

      - name: install a virtual audio device (VB-CABLE) and ffmpeg, for the loopback capture
        continue-on-error: true
        shell: pwsh
        run: |
          # hosted runners have no sound device and the Windows Audio service stopped: start it first
          Set-Service Audiosrv -StartupType Automatic
          Start-Service Audiosrv
          Set-Service AudioEndpointBuilder -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
          choco install ffmpeg -y --no-progress
          choco install vb-cable -y --no-progress
          Start-Sleep -Seconds 5
          Get-Service Audiosrv, AudioEndpointBuilder | Format-Table Status, Name -AutoSize
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table Status, FriendlyName -AutoSize

      - name: build and smoke-test the Windows executables
        shell: bash
        run: |
          uv run pyinstaller packaging/stadiacast.spec --noconfirm --clean
          dist/stadiacast.exe --version
          dist/stadiacast.exe --help > /dev/null
          dist/stadiacast.exe --helper dns_sink --help > /dev/null
          dist/stadiacast-provision.exe --help > /dev/null
          dist/stadiacast.exe --audio-devices || true
      - name: what the runner offers a virtual pad (the Xbox 360 driver) and a capture (audio endpoints)
        shell: pwsh
        run: |
          "xusb22.sys (the inbox Xbox 360 controller driver): " + (Test-Path C:\Windows\System32\drivers\xusb22.sys)
          "xusb22.inf in the driver store: " + ((Get-ChildItem C:\Windows\INF\xusb22.inf -ErrorAction SilentlyContinue) -ne $null)
          pnputil /enum-drivers | Select-String -Pattern "xusb|vigem|xinput" -Context 0,3
          "--- ViGEm bus and any pad it exposes"
          Get-PnpDevice | Where-Object { $_.FriendlyName -match "ViGEm|Xbox|Gamepad|Controller" } | Format-Table Status, Class, FriendlyName, InstanceId -AutoSize
          "--- audio"
          Get-Service Audiosrv, AudioEndpointBuilder | Format-Table Status, Name -AutoSize
          Get-PnpDevice -Class AudioEndpoint, MEDIA -ErrorAction SilentlyContinue | Format-Table Status, Class, FriendlyName -AutoSize
          uv run python -c "from stadiacast import loopback; print('loopback devices:', loopback.devices())"
      - name: the real drivers, through the fake controller
        env:
          STADIACAST_WINDOWS_LAB: "1"
        run: uv run pytest -q -rs tests/test_windows_lab.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-executables
          path: dist/*.exe
